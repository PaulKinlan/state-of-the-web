<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plain fixture</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  h1 { font-size: 1.5rem; }
  @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }
  .badge { animation: pulse 2s infinite alternate; border-radius: 4px; padding: 2px 6px; }
</style>
</head>
<body>
  <main>
    <h1>Plain fixture</h1>
    <p>A page with ordinary CSS and no modern-web platform features.</p>
    <span class="badge" style="color: #123456">badge</span>
  </main>
  <script>
    document.querySelector('.badge').addEventListener('click', () => {
      document.body.dataset.clicked = 'yes';
    });
  </script>
</body>
</html>
